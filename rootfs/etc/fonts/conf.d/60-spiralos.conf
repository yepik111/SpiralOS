<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <alias><family>sans-serif</family><prefer><family>Spiral Sans</family><family>Inter</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>Spiral Mono</family><family>DejaVu Sans Mono</family></prefer></alias>
  <alias binding="same"><family>Spiral Sans</family><accept><family>Inter</family></accept></alias>
  <alias binding="same"><family>Spiral Mono</family><accept><family>DejaVu Sans Mono</family></accept></alias>
</fontconfig>
